name: ChatAnalyzer
version: 1.0.0
main: id.chat.analyzer.ChatAnalyzerPlugin
api-version: '1.19'
author: YourName
description: Minecraft chat dataset collector.

commands:
  chatanalyzer:
    description: Controls the ChatAnalyzer collector.
    usage: /chatanalyzer <start|stop|status|export|reload>
    permission: chatanalyzer.admin

permissions:
  chatanalyzer.admin:
    description: Allows managing the ChatAnalyzer collector.
    default: op
